<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- Essa linha faz o site funcionar bem no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">9º Ano — Estudante Exemplo</p>
  </header>

  <!-- CARDS DE RESUMO -->
  <!-- Os valores serão preenchidos pelo JavaScript -->
  <section class="cards">
    <div class="card">
      <h2>Média geral</h2>
      <p id="card-media-geral">—</p>
    </div>

    <div class="card">
      <h2>Total de faltas</h2>
      <p id="card-total-faltas">—</p>
    </div>

    <div class="card">
      <h2>Bom desempenho</h2>
      <p id="card-bom-desempenho">—</p>
    </div>

    <div class="card">
      <h2>Precisam de atenção</h2>
      <p id="card-atencao">—</p>
    </div>

    <div class="card">
      <h2>Frequência</h2>
      <p id="card-frequencia">—</p>
    </div>
  </section>

  <!-- TABELA DE DISCIPLINAS -->
  <!-- O corpo da tabela (tbody) é preenchido pelo JavaScript -->
  <section class="tabela-area">
    <table class="boletim">
      <thead>
        <tr>
          <th>Disciplina</th>
          <th>1º Tri</th>
          <th>2º Tri</th>
          <th>3º Tri</th>
          <th>Média</th>
          <th>Faltas</th>
          <th>Situação</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela">
        <!-- As linhas serão criadas pelo script.js -->
      </tbody>
    </table>
  </section>

  <!-- Ligação com o JavaScript -->
  <script src="script.js"></script>
</body>
</html>
